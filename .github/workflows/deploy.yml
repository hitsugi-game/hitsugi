name: Verify and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.12.1 && npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Validate game data
        run: node scripts/validate_data.mjs

      - name: Validate visual closure
        run: npm run check:visual-closure

      - name: Validate visual recovery manifest
        run: npm run check:visual-manifest

      - name: Validate public asset BOM
        run: npm run check:asset-bom

      - name: Unit and integration tests
        run: npm test

      - name: Build release candidate
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Validate built copies of public assets
        run: npm run check:asset-bom:dist

      - name: Enforce staged performance ceilings
        run: npm run check:performance

      - name: Install release browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser core route and recovery smoke
        run: npm run test:release-smoke

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-${{ github.run_id }}
          path: tests/release/.artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Package verified Pages candidate
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify public HTML, bundles and commit marker
        run: node scripts/verify_deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
